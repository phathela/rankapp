version: '3.8'

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rankapp
      POSTGRES_PASSWORD: rankapp_pass
      POSTGRES_DB: rankapp
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgresql://rankapp:rankapp_pass@db:5432/rankapp
      JWT_SECRET: dev-jwt-secret-change-in-production
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      FRONTEND_URL: http://localhost:5173
      PORT: 3001
    depends_on:
      - db
    volumes:
      - ./backend/src:/app/backend/src

volumes:
  pgdata:
